<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile City</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-box{
position:relative;
width:240px;
height:240px;
display:flex;
justify-content:center;
align-items:center;
}

.ring{
position:absolute;
width:240px;
height:240px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,
#eef9ff 0%,
#d9f1fb 18%,
#bfe5f7 38%,
#9fd1ef 58%,
#83bee8 78%,
#6ea9df 100%);
}

.ring::after{
content:"";
position:absolute;
width:70px;
height:70px;
border-radius:50%;
background:radial-gradient(circle,
#ffffff 0%,
#f5fbff 55%,
#dbeef8 100%);
top:40px;
right:-8px;
}


.logo{
position:absolute;
color:#fff;
font-size:30px;
font-weight:bold;
letter-spacing:2px;
z-index:5;

animation:glow 1.2s ease-in-out infinite alternate;

text-shadow:
0 0 10px #00ffff,
0 0 20px #00e5ff,
0 0 40px #00ff88,
0 0 80px #00ffff;
}

@keyframes glow{

from{
text-shadow:
0 0 10px #00e5ff,
0 0 20px #00ffff;
}

to{
text-shadow:
0 0 20px #00ff88,
0 0 40px #00ffff,
0 0 80px #00e5ff;
}

}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
.flash{
position:absolute;
width:250px;
height:250px;
border-radius:50%;
border:3px solid rgba(0,229,255,.4);
box-shadow:
0 0 30px #00ffff,
0 0 60px #00e5ff,
0 0 120px #00ff88,
0 0 180px #00ffff,
0 0 250px #00e5ff;
animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
0%{
transform:scale(1);
opacity:1;
}
50%{
transform:scale(1.08);
opacity:.5;
}
100%{
transform:scale(1);
opacity:1;
}
}

#content{
display:none;
padding:30px;
color:#ffffff;
text-align:center;
}

h1{
font-size:36px;
margin-bottom:15px;
}

p{
font-size:20px;
line-height:1.6;
}
</style>

</head>

<body>

<div id="loader">

<div class="loader-box">

<div class="flash"></div>

<div class="ring"></div>

<div class="logo">
Mobile City
</div>

</div>

</div>

<div id="content">

<h1>Welcome To Mobile City</h1>

<p>یہ میری پہلی ویب سائٹ ہے۔</p>

</div>

<script>

setTimeout(function(){

document.getElementById("loader").style.display="none";
document.getElementById("content").style.display="block";
document.body.style.overflow="auto";

},10000);

</script>

</body>

</html>
