<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile City</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-box{
position:relative;
width:240px;
height:240px;
display:flex;
justify-content:center;
align-items:center;
}

.ring{
position:absolute;
width:220px;
height:220px;
border-radius:50%;
background:conic-gradient(#00e5ff,#00ff88,#00e5ff,#00ff88,#00e5ff);
animation:spin 2s linear infinite;
box-shadow:
0 0 20px #00e5ff,
0 0 40px #00ff88,
0 0 80px #00e5ff;
}

.ring::before{
content:"";
position:absolute;
top:12px;
left:12px;
right:12px;
bottom:12px;
background:#000;
border-radius:50%;
}

.logo{
position:absolute;
color:#fff;
font-size:28px;
font-weight:bold;
z-index:2;
text-shadow:
0 0 10px #00e5ff,
0 0 20px #00ff88,
0 0 40px #00e5ff;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
