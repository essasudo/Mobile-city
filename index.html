<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile City</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-box{
position:relative;
width:240px;
height:240px;
display:flex;
justify-content:center;
align-items:center;
}

.ring{
position:absolute;
width:240px;
height:240px;
border-radius:50%;
background:conic-gradient(#00e5ff,#00ff88,#00e5ff,#00ff88,#00e5ff);
animation:spin 2s linear infinite;
box-shadow:
box-shadow:
0 0 15px #00e5ff,
0 0 35px #00e5ff,
0 0 60px #00ff88,
0 0 90px #00e5ff,
0 0 140px #00ff88;
}

.ring::before{
content:"";
position:absolute;
top:14px;
left:14px;
right:14px;
bottom:14px;
background:#000;
border-radius:50%;
}

.logo{
position:absolute;
color:#fff;
font-size:28px;
font-weight:bold;
z-index:2;
text-shadow:
0 0 10px #00e5ff,
0 0 20px #00ff88,
0 0 40px #00e5ff;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
.flash{
position:absolute;
width:250px;
height:250px;
border-radius:50%;
border:3px solid rgba(0,229,255,.4);
box-shadow:
0 0 20px #00e5ff,
0 0 50px #00ff88,
0 0 100px #00e5ff;
animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
0%{
transform:scale(1);
opacity:1;
}
50%{
transform:scale(1.08);
opacity:.5;
}
100%{
transform:scale(1);
opacity:1;
}
}

#content{
display:none;
padding:30px;
color:#ffffff;
text-align:center;
}

h1{
font-size:36px;
margin-bottom:15px;
}

p{
font-size:20px;
line-height:1.6;
}
</style>

</head>

<body>

<div id="loader">

<div class="loader-box">

<div class="flash"></div>

<div class="ring"></div>

<div class="logo">
Mobile City
</div>

</div>

</div>

<div id="content">

<h1>Welcome To Mobile City</h1>

<p>یہ میری پہلی ویب سائٹ ہے۔</p>

</div>

<script>

setTimeout(function(){

document.getElementById("loader").style.display="none";
document.getElementById("content").style.display="block";
document.body.style.overflow="auto";

},10000);

</script>

</body>

</html>
