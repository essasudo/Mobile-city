<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile City</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-box{
position:relative;
width:320px;
height:320px;
display:flex;
justify-content:center;
align-items:center;
}

.ring{
position:absolute;
width:250px;
height:250px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,
#eef9ff 0%,
#d9f1fb 18%,
#bfe5f7 38%,
#9fd1ef 58%,
#83bee8 78%,
#6ea9df 100%);
box-shadow:
0 0 20px rgba(150,210,240,.6),
0 0 40px rgba(150,210,240,.5),
0 0 70px rgba(150,210,240,.4);
animation:pulse 2s ease-in-out infinite;
}

.ring::after{
content:"";
position:absolute;
width:85px;
height:85px;
border-radius:50%;
top:42px;
right:-12px;
background:radial-gradient(circle at 35% 30%,
#eef9ff 0%,
#d9f1fb 40%,
#bfe5f7 70%,
#9fd1ef 100%);
}

.logo{
position:absolute;
z-index:5;
font-size:30px;
font-weight:bold;
color:#000;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

#content{
display:none;
padding:30px;
text-align:center;
}

</style></head>

<body>

<div id="loader">

<div class="loader-box">

<div class="ring"></div>

<div class="logo">
Mobile City
</div>

</div>

</div>

<div id="content">

<h1>Welcome To Mobile City</h1>

<p>یہ میری پہلی ویب سائٹ ہے۔</p>

</div>

<script>

setTimeout(function(){

document.getElementById("loader").style.display="none";
document.getElementById("content").style.display="block";
document.body.style.overflow="auto";

},10000);

</script>

</body>
</html>
