<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile City</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-box{
position:relative;
width:320px;
height:320px;
display:flex;
justify-content:center;
align-items:center;
}

.ring{
position:absolute;
width:250px;
height:250px;
border-radius:500%;

background: linear-gradient(
135deg,
#ffffff 40%,
#eef7fc 45%,
#D9F4E6 100%
);
rgba(223,245,235,0) 28%),
linear-gradient(135deg,
#88a6f4 50%,
#9fc0f3 22%,
#b8d8f5 48%,
#d3eef5 74%,
#eaf8f0 100%);

box-shadow:
0 0 8px rgba(170,215,245,.18),
0 0 18px rgba(170,215,245,.12),
0 0 30px rgba(170,215,245,.06);

animation:pulse 2s ease-in-out infinite;
}

.ring::after{
content:"";
position:absolute;
width:85px;
height:85px;
border-radius:500%;
top:40px;
right:-5px;

background:
radial-gradient(circle at 72% 72%,
#d9f3df 50%,
rgba(217,243,223,0) 38%),
linear-gradient(135deg,
#ffffff 40%,
#f5fbfd 35%,
#e8f6fc 68%,
#d8f3e4 100%);
}

.logo{
position:absolute;
z-index:5;
font-size:30px;
font-weight:bold;
color:#ffffff;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

#content{
display:none;
padding:30px;
text-align:center;
}

</style></head>

<body>

<div id="loader">

<div class="loader-box">

<div class="ring"></div>

<div class="logo">
Mobile City
</div>

</div>

</div>

<div id="content">

<h1>Welcome To Mobile City</h1>

<p>یہ میری پہلی ویب سائٹ ہے۔</p>

</div>

<script>

setTimeout(function(){

document.getElementById("loader").style.display="none";
document.getElementById("content").style.display="block";
document.body.style.overflow="auto";

},500000);

</script>

</body>
</html>
